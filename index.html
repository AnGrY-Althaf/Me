<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Althaf Shajahan — Blog</title>
    <meta
      name="description"
      content="Bug bounty writeups and offensive security research by Althaf Shajahan (AnGrY)."
    />
    <link rel="canonical" href="https://blog.althafthehacker.com/" />

    <meta property="og:type" content="website" />
    <meta property="og:title" content="Althaf Shajahan — Blog" />
    <meta
      property="og:description"
      content="Bug bounty writeups and offensive security research by Althaf Shajahan (AnGrY)."
    />
    <meta property="og:url" content="https://blog.althafthehacker.com/" />
    <meta name="twitter:card" content="summary" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;500&display=swap"
      rel="stylesheet"
    />

    <script>
      // Set the theme before first paint so the page never flashes white
      // while React boots. Dark unless the visitor chose light previously.
      (function () {
        var theme = 'dark';
        try {
          if (localStorage.getItem('theme') === 'light') theme = 'light';
        } catch (e) {}
        document.documentElement.dataset.theme = theme;
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/index.tsx"></script>
  </body>
</html>
